      - name: Extract and Clean Up
        run: |
          # 1. Unzip while ignoring .git folders and hidden workspace metadata
          unzip -o "${{ github.event.inputs.zip_path }}" -x "*.git*" "*.workspace*" || [ $? -eq 50 ]

          # 2. Optionally remove the zip file so you don't commit it back into the repo
          rm "${{ github.event.inputs.zip_path }}"

          # 3. Commit and push extracted files
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unzip ${{ github.event.inputs.zip_path }}" || echo "Nothing to commit"
          git push origin HEAD:${{ github.ref_name }}
          
