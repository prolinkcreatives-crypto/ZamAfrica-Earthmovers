name: Unzip
on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path to zip file'
        required: true

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract and Commit
        run: |
          # Verify file exists
          if [ ! -f "${{ github.event.inputs.zip_path }}" ]; then
            echo "Error: File ${{ github.event.inputs.zip_path }} not found!"
            exit 1
          fi

          # Unzip file
          unzip -o "${{ github.event.inputs.zip_path }}"

          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage and commit
          git add .
          git commit -m "Unzip ${{ github.event.inputs.zip_path }}" || echo "Nothing to commit"

          # Push specifying current branch explicitly
          git push origin HEAD:${{ github.ref_name }}
          
